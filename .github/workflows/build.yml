name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    # Refresh headlines every hour.
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      x_stories:
        description: 'Fresh stories to post to X this run (own articles and picks always post)'
        default: '0'
      x_repost:
        description: 'Post this item to X again, with its picture (article URL, id or title fragment)'
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Never run two refreshes at once; let the newest one win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Restore the previous build's data so sections survive a feed outage.
      - name: Restore previous articles
        uses: actions/cache/restore@v4
        with:
          path: dist/data
          key: articles-${{ github.run_id }}
          restore-keys: articles-
      - run: npm run build -- --verbose
        env:
          # Optional: self-hosted feed server for X / Instagram / TikTok / Facebook (see server/README.md)
          FEEDS_SERVER_URL: ${{ secrets.FEEDS_SERVER_URL }}
          RSSHUB_ACCESS_KEY: ${{ secrets.RSSHUB_ACCESS_KEY }}
          FEEDS_BASIC_AUTH: ${{ secrets.FEEDS_BASIC_AUTH }}
          # Optional: YouTube Data API key, used when YouTube's RSS feed server fails (see README)
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # Optional: Instagram via the official Graph API (run scripts/instagram-setup.js once)
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - name: Announce new items on Telegram and X (needs secrets; skipped otherwise)
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/announce.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_STORIES_PER_RUN: ${{ github.event.inputs.x_stories || '0' }}
          X_REPOST: ${{ github.event.inputs.x_repost || '' }}
      - name: Check feed health
        id: health
        run: node scripts/health.js --threshold 3
      - name: Open, update or close the feed-health issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v7
        env:
          ALERT: ${{ steps.health.outputs.alert }}
          BODY: ${{ steps.health.outputs.body }}
          COUNT: ${{ steps.health.outputs.count }}
        with:
          script: |
            const label = 'feed-health';
            const title = 'Feed health: some sources are failing';
            const { owner, repo } = context.repo;
            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: 'open', per_page: 5 });
            const existing = open.find((i) => i.title === title);
            if (process.env.ALERT === 'true') {
              const body = process.env.BODY + `\n\n_Last checked by [this run](${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId})._`;
              if (existing) await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              else {
                try { await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd93f0b', description: 'Automated feed-health alerts' }); } catch {}
                await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              }
            } else if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: 'All sources are healthy again. Closing automatically.' });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }
      - name: Save articles for next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: dist/data
          key: articles-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
