name: Probe a feed

# Diagnostic: fetch a URL (or a @youtubehandle) from GitHub's runners and print what the publisher serves.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Feed URL, page URL, @youtubehandle, or podcast:<name>; several separated by spaces for a one-line check each'
        required: true
        type: string

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/probe.js "${{ inputs.target }}"
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
